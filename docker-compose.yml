services:
  veritabani:
    image: postgres:16
    container_name: bootcamp_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bootcamp_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  datalake:
    image: rustfs/rustfs:latest
    container_name: bootcamp_rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: password123
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

  metabase:
    image: metabase/metabase:latest
    container_name: bootcamp_metabase
    ports:
      - "3000:3000"    

volumes:
  postgres_data:
  rustfs_data: